set -g mouse on
set-window-option -g mode-keys vi
set-option -g status-keys vi
set -g history-limit 10000
# Renumber windows when one closes so indexes stay contiguous (0, 1, 2, ...).
set -g renumber-windows on
set -g extended-keys on
set -g extended-keys-format csi-u

# macOS: pipe selections straight to the system clipboard instead of relying on
# the terminal's clipboard escape-sequence support (Apple Terminal ignores it).
if-shell "uname | grep -q Darwin" "set -g copy-command pbcopy"
if-shell "command -v wl-copy >/dev/null 2>&1" "set -g copy-command wl-copy"
set -ag update-environment " WAYLAND_DISPLAY"
# Also pass OSC 52 clipboard writes from apps inside tmux (e.g. a remote tmux over
# ssh) through to the outer terminal. The default, "external", drops them.
set -s set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Keep the status bar dark, with a small cream highlight on the active window.
set -g status-style 'bg=#252820,fg=#a7b985'
set -g window-status-style 'bg=default,fg=#909580'
set -g window-status-current-style 'bg=#e6dfc8,fg=#252820,bold'
set -g window-status-current-format ' #I:#W#F '

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Survive reboots: resurrect saves sessions, windows, panes and scrollback
# (prefix + C-s / C-r); continuum saves every 15 minutes and restores on start.
# chezmoi clones tpm and both plugins via .chezmoiexternal.toml.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
run '~/.tmux/plugins/tpm/tpm'
